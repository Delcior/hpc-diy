global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # node_exporter and process-exporter run with host networking on the
  # monitoring host. Add the other nodes' addresses to these target lists.
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          node: monitoring-host
      # - targets: ["raspberry-pi:9100"]
      #   labels:
      #     node: raspberry-pi
      # - targets: ["jetson-one:9100", "jetson-two:9100"]

  - job_name: process-exporter
    static_configs:
      - targets: ["host.docker.internal:9256"]
        labels:
          node: monitoring-host
