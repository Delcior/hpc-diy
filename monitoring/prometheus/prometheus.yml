global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # node_exporter runs on the monitoring host and cluster nodes. The
  # monitoring host's DNS resolves the cluster hostnames.
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          node: monitoring-host
      - targets: ["major-tom:9100"]
        labels:
          node: major-tom
      - targets: ["ground-control:9100"]
        labels:
          node: ground-control

  - job_name: process-exporter
    static_configs:
      - targets: ["host.docker.internal:9256"]
        labels:
          node: monitoring-host
